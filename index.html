<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <link rel="apple-touch-icon" href="/images/logo.png" />
    <meta name="theme-color" content="#344AA7" />

    <title>Colombo Kickerz Football Academy | Sri Lanka's Leading Youth Football Academy</title>
    <meta
      name="description"
      content="Founded in 2015, Colombo Kickerz Football Academy trains 300+ children every year. Internationally certified coaches, local and international tournaments, ages 5-18."
    />
    <link rel="canonical" href="https://colombokickerz.lk/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Colombo Kickerz Football Academy" />
    <meta property="og:title" content="Colombo Kickerz Football Academy" />
    <meta
      property="og:description"
      content="Sri Lanka's leading youth football academy. Training 300+ children every year since 2015."
    />
    <meta property="og:image" content="/images/hero/hero-juventus.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Archivo for display headings, Poppins for body copy -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsActivityLocation",
        "name": "Colombo Kickerz Football Academy",
        "description": "Sri Lanka's leading youth football academy, founded in 2015.",
        "url": "https://colombokickerz.lk/",
        "logo": "https://colombokickerz.lk/images/logo.png",
        "telephone": "+94777749559",
        "email": "info@colombokickerz.lk",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Colombo Racecourse Ground",
          "addressLocality": "Colombo",
          "addressCountry": "LK"
        },
        "foundingDate": "2015"
      }
    </script>
  </head>
  <body>
    <!--
      The inline background is the splash screen's first frame: it paints
      before the bundle has even parsed, so the load starts dark instead of
      flashing the site's light background. components/layout/Preloader.jsx
      strips it once React is rendering.
    -->
    <div id="root" style="background-color: #05070f; min-height: 100vh"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
